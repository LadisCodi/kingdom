<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kingdom</title>
    <link rel="icon" type="image/png" href="./src/render/assets/townhall_l3.png" />
    <!-- The loading screen's own look, inline: it paints before the bundle's
         CSS arrives (src/ui/bootScreen.ts). Dark wood, a carved groove, a
         brass fill; above every layer of the game. -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-content: center; justify-items: center; gap: 28px;
        background:
          radial-gradient(ellipse at 50% 38%, rgba(255, 214, 150, 0.10), transparent 60%),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.10) 0 2px, transparent 2px 9px),
          linear-gradient(#2a1d12, #14100c);
        color: #f4e4c1;
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
        transition: opacity 350ms ease;
      }
      #boot.is-leaving { opacity: 0; pointer-events: none; }
      #boot .boot-title {
        margin: 0; font-size: 44px; font-weight: 800; letter-spacing: 0.04em;
        color: #f2b233; text-shadow: 0 2px 0 #5c3a1e, 0 4px 10px rgba(0, 0, 0, 0.6);
      }
      #boot .boot-groove {
        width: min(260px, 70vw); height: 14px; border-radius: 7px; overflow: hidden;
        background: linear-gradient(#1b120a, #3a2615);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 230, 190, 0.18);
      }
      #boot .boot-fill {
        height: 100%; transform-origin: left center;
        transform: scaleX(var(--boot-progress, 0));
        transition: transform 200ms ease-out;
        background: linear-gradient(#ffe08a, #f2b233 45%, #c98a16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="map"></canvas>
      <canvas id="world"></canvas>
      <div id="ui">
        <header id="header"></header>
        <div id="quest"></div>
        <div id="survey"></div>
        <div id="notice"></div>
        <div id="edge">
          <div id="adoffer"></div>
        </div>
        <div id="worldknob"></div>
        <div id="worldchip"></div>
        <div id="panel"></div>
        <div id="overlay"></div>
        <div id="flyers"></div>
        <nav id="navbar"></nav>
        <div id="toast"></div>
        <div id="battle"></div>
        <div id="stage"></div>
        <div id="unlock"></div>
        <div id="gacha"></div>
        <div id="ad"></div>
      </div>
    </div>
    <div id="boot" role="progressbar" aria-label="Loading">
      <h1 class="boot-title">Kingdom</h1>
      <div class="boot-groove"><div class="boot-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
